<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Gerenciador de Produtos</h1>
    <p>Cadastre, edite e remova produtos do estoque.</p>
  </header>

  <main>
    <p id="mensagem" role="alert" hidden></p>

    <div class="conteudo">
    <section class="painel" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Novo produto</h2>
      <form id="form-produto">
        <input type="hidden" id="produto-id">

        <label for="nome">Nome</label>
        <input type="text" id="nome" required>

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" required>

        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" min="0" step="0.01" required>

        <label for="estoque">Estoque (unidades)</label>
        <input type="number" id="estoque" min="0" step="1" required>

        <div class="acoes">
          <button type="submit" id="btn-salvar">Cadastrar produto</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="painel" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Produtos cadastrados</h2>
      <ul id="lista-produtos"></ul>
    </section>
    </div>
  </main>

  <footer>
    <p>Atividade de Programação Web, IFMT.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
